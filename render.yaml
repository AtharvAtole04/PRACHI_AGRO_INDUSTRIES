services:
  - type: web
    name: prachi-agro-industries
    env: node
    plan: free
    buildCommand: npm run install-all && npm run build --prefix frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
