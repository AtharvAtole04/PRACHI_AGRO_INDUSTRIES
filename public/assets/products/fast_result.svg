<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="250" rx="15" fill="#f8fafc"/>
  
  <!-- Bottle Shape -->
  <path d="M70,80 L70,55 L65,55 L65,45 L135,45 L135,55 L130,55 L130,80 C155,100 160,120 160,160 L160,210 C160,225 150,230 130,230 L70,230 C50,230 40,225 40,210 L40,160 C40,120 45,100 70,80 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Magenta Cap -->
  <rect x="75" y="25" width="50" height="20" rx="3" fill="#c20063"/>
  <line x1="85" y1="25" x2="85" y2="45" stroke="#9e0050" stroke-width="1.5"/>
  <line x1="95" y1="25" x2="95" y2="45" stroke="#9e0050" stroke-width="1.5"/>
  <line x1="105" y1="25" x2="105" y2="45" stroke="#9e0050" stroke-width="1.5"/>
  <line x1="115" y1="25" x2="115" y2="45" stroke="#9e0050" stroke-width="1.5"/>

  <!-- Bottle Neck Ring -->
  <rect x="70" y="45" width="60" height="10" fill="#f1f5f9"/>

  <!-- Main Label -->
  <rect x="45" y="105" width="110" height="95" rx="5" fill="#c20063"/>
  
  <!-- Label Content -->
  <rect x="50" y="110" width="100" height="85" rx="3" fill="#ffffff"/>
  
  <!-- Mini Logo -->
  <rect x="85" y="115" width="30" height="15" rx="2" fill="#fce7f3"/>
  <text x="100" y="125" font-family="Arial" font-size="6" font-weight="bold" fill="#be185d" text-anchor="middle">PRACHI</text>
  
  <!-- Product Name -->
  <text x="100" y="152" font-family="Arial" font-size="12" font-weight="black" fill="#c20063" text-anchor="middle" letter-spacing="0.5">FAST RESULT</text>
  
  <!-- Product Tagline -->
  <rect x="55" y="160" width="90" height="8" rx="2" fill="#be185d"/>
  <text x="100" y="166" font-family="Arial" font-size="5" font-weight="bold" fill="#ffffff" text-anchor="middle">FOR GROWTH &amp; BUDS DEVELOPMENT</text>

  <!-- Red/Pink Flower and Leaf Art -->
  <circle cx="100" cy="184" r="3.5" fill="#c20063"/>
  <circle cx="95" cy="180" r="3" fill="#f43f5e"/>
  <circle cx="105" cy="180" r="3" fill="#f43f5e"/>
  <circle cx="95" cy="188" r="3" fill="#f43f5e"/>
  <circle cx="105" cy="188" r="3" fill="#f43f5e"/>
  <path d="M100,184 L100,195" stroke="#15803d" stroke-width="1"/>
</svg>
